name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Check GitHub for repo changes every 15 minutes; the build only runs when
  # something changed (repo created/deleted/renamed, description, stars, push).
  schedule:
    - cron: '*/15 * * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - name: Fingerprint public GitHub data
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          {
            gh api --paginate "users/$OWNER/repos?type=public&per_page=100" \
              --jq '.[] | [.name, .description, .homepage, .language, (.topics | join(",")), .stargazers_count, .forks_count, .archived, .fork, .pushed_at] | @json' | sort
            gh api "users/$OWNER" --jq '[.name, .bio, .followers] | @json'
          } > github-data.txt
          echo "value=$(sha256sum github-data.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Look up last deployed fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: github-data.txt
          key: github-data-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building: event=${{ github.event_name }}, data changed=${{ steps.cache.outputs.cache-hit != 'true' }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub changes since the last deploy; skipping build."
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          # The workflow's built-in token: higher GitHub API rate limit, nothing to rotate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "" for <user>.github.io repos, "/<repo>" otherwise.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Remember this fingerprint so the next scheduled check can skip the build.
      - name: Record deployed fingerprint
        run: echo "${{ needs.check.outputs.fingerprint }}" > github-data.txt

      - name: Save fingerprint
        uses: actions/cache/save@v4
        with:
          path: github-data.txt
          key: github-data-${{ needs.check.outputs.fingerprint }}
